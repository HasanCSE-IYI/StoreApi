<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Management Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- ১. হেডার -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-sky-400">⚡ Store API Dashboard</h1>
        <p class="text-xs text-slate-400 mt-1">ASP.NET Core Web API + SQLite + JWT</p>
      </div>
      <div id="authStatus" class="text-sm text-slate-400">Not Logged In</div>
    </header>

    <!-- ২. লগইন কার্ড -->
    <div id="loginCard" class="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-md mx-auto shadow-lg">
      <h2 class="text-lg font-semibold mb-4 text-white">Login to Dashboard</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Username</label>
          <input id="username" type="text" placeholder="e.g. shakil" class="w-full bg-slate-900 border border-slate-700 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-sm">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Password</label>
          <input id="password" type="password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 px-3 py-2 rounded focus:outline-none focus:border-sky-500 text-sm">
        </div>
        <button onclick="login()" class="w-full bg-sky-600 hover:bg-sky-500 py-2 rounded font-medium transition text-sm">Sign In</button>
      </div>
    </div>

    <!-- ৩. মূল ড্যাশবোর্ড -->
    <div id="dashboard" class="hidden space-y-6">
      <!-- প্রোডাক্ট অ্যাড ফর্ম -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
        <h3 class="text-md font-semibold mb-3 text-sky-400 flex items-center gap-2">
          <span>➕ Add New Product</span>
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <input id="pName" placeholder="Product Name *" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-sky-500">
          <input id="pCategory" placeholder="Category" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-sky-500">
          <input id="pPrice" type="number" step="0.01" placeholder="Price (৳) *" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-sky-500">
          <input id="pStock" type="number" placeholder="Stock Quantity *" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-sky-500">
        </div>
        <button onclick="addProduct()" class="mt-3 bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded text-sm font-semibold transition flex items-center gap-2">
          <span>Save Product</span>
        </button>
      </div>

      <!-- প্রোডাক্ট টেবিল -->
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-md">
        <div class="flex justify-between items-center p-4 border-b border-slate-700 bg-slate-850">
          <h3 class="font-semibold text-slate-200">Inventory Items</h3>
          <button onclick="loadProducts()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">Refresh Table</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-slate-950/60 text-slate-400 text-xs uppercase tracking-wider">
              <tr>
                <th class="p-3.5">ID</th>
                <th class="p-3.5">Product</th>
                <th class="p-3.5">Category</th>
                <th class="p-3.5">Price</th>
                <th class="p-3.5">Stock</th>
                <th class="p-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="productTableBody" class="divide-y divide-slate-700 font-normal">
              <!-- ডাইনামিক রো লোড হবে -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ৪. এডিট মোডাল (Edit Modal Dialog) -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <h3 class="text-lg font-semibold text-sky-400">Edit Product</h3>
          <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
        </div>
        
        <input type="hidden" id="editId">

        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Product Name</label>
            <input id="editName" type="text" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Category</label>
            <input id="editCategory" type="text" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Price (৳)</label>
              <input id="editPrice" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm focus:outline-none focus:border-sky-500">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Stock</label>
              <input id="editStock" type="number" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-700">
          <button onclick="closeEditModal()" class="px-4 py-1.5 rounded text-sm bg-slate-700 hover:bg-slate-600 transition">Cancel</button>
          <button onclick="updateProduct()" class="px-4 py-1.5 rounded text-sm bg-sky-600 hover:bg-sky-500 font-semibold transition">Update</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let token = localStorage.getItem('jwt_token') || '';
    let currentRole = localStorage.getItem('jwt_role') || '';
    let productsList = [];

    // টোকেন সেভ থাকলে সরাসরি ড্যাশবোর্ড লোড হবে
    if (token) {
      showDashboard(localStorage.getItem('jwt_user') || 'User');
    }

    async function login() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      
      if (!u || !p) return alert('Username & Password required!');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });

        if (res.ok) {
          const data = await res.json();
          token = data.token;
          currentRole = data.role;
          localStorage.setItem('jwt_token', token);
          localStorage.setItem('jwt_user', data.username);
          localStorage.setItem('jwt_role', data.role);
          showDashboard(data.username);
        } else {
          alert('Login failed! Invalid username or password.');
        }
      } catch (err) {
        alert('Server unreachable or error occurred.');
      }
    }

    function showDashboard(username) {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('authStatus').innerHTML = `
        User: <span class="text-sky-400 font-semibold">${username} (${currentRole})</span> 
        | <button onclick="logout()" class="text-rose-400 hover:underline">Logout</button>
      `;
      loadProducts();
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    // ১. প্রোডাক্ট লোড করা (GET)
    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        productsList = await res.json();
        const tbody = document.getElementById('productTableBody');
        
        if (productsList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">No products found.</td></tr>`;
          return;
        }

        tbody.innerHTML = productsList.map(p => `
          <tr class="hover:bg-slate-750/50 border-slate-700/60">
            <td class="p-3.5 text-slate-400 font-mono text-xs">#${p.id}</td>
            <td class="p-3.5 font-medium text-white">${p.name}</td>
            <td class="p-3.5 text-slate-300">${p.category || '-'}</td>
            <td class="p-3.5 text-emerald-400 font-mono">৳${p.price.toFixed(2)}</td>
            <td class="p-3.5">${p.stock}</td>
            <td class="p-3.5 text-right space-x-2">
              <button onclick="openEditModal(${p.id})" class="text-xs bg-sky-600/20 text-sky-400 hover:bg-sky-600 hover:text-white px-2.5 py-1 rounded transition">Edit</button>
              <button onclick="deleteProduct(${p.id})" class="text-xs bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white px-2.5 py-1 rounded transition">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Error loading products:', err);
      }
    }

    // ২. নতুন প্রোডাক্ট যোগ করা (POST)
    async function addProduct() {
      const name = document.getElementById('pName').value.trim();
      const category = document.getElementById('pCategory').value.trim();
      const price = parseFloat(document.getElementById('pPrice').value);
      const stock = parseInt(document.getElementById('pStock').value);

      if (!name || isNaN(price) || isNaN(stock)) {
        return alert('Please fill in Name, Price, and Stock correctly.');
      }

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ name, category, price, stock })
      });

      if (res.ok) {
        loadProducts();
        document.getElementById('pName').value = '';
        document.getElementById('pCategory').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pStock').value = '';
      } else if (res.status === 401) {
        alert('Session expired or Unauthorized. Please log in again.');
      } else {
        alert('Validation error occurred while saving.');
      }
    }

    // ৩. এডিট মোডাল ওপেন ও ফর্ম ফিল করা
    function openEditModal(id) {
      const p = productsList.find(x => x.id === id);
      if (!p) return;

      document.getElementById('editId').value = p.id;
      document.getElementById('editName').value = p.name;
      document.getElementById('editCategory').value = p.category || '';
      document.getElementById('editPrice').value = p.price;
      document.getElementById('editStock').value = p.stock;

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    // ৪. আপডেট পাঠানো (PUT)
    async function updateProduct() {
      const id = document.getElementById('editId').value;
      const name = document.getElementById('editName').value.trim();
      const category = document.getElementById('editCategory').value.trim();
      const price = parseFloat(document.getElementById('editPrice').value);
      const stock = parseInt(document.getElementById('editStock').value);

      if (!name || isNaN(price) || isNaN(stock)) {
        return alert('Please fill in all required fields.');
      }

      const res = await fetch(`/api/products/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ name, category, price, stock })
      });

      if (res.ok) {
        closeEditModal();
        loadProducts();
      } else if (res.status === 401) {
        alert('Session expired. Please log in again.');
      } else {
        alert('Failed to update product.');
      }
    }

    // ৫. প্রোডাক্ট ডিলিট করা (DELETE)
    async function deleteProduct(id) {
      if (!confirm(`Are you sure you want to delete Product #${id}?`)) return;

      const res = await fetch(`/api/products/${id}`, {
        method: 'DELETE',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (res.ok) {
        loadProducts();
      } else if (res.status === 403) {
        alert('Access Denied (403): Only "Admin" users can delete products!');
      } else if (res.status === 401) {
        alert('Unauthorized (401): Please log in.');
      } else {
        alert('Failed to delete product.');
      }
    }
  </script>
</body>
</html>
