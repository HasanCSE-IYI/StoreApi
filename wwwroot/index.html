<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Store Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    
    
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-sky-400">⚡ Store Manager Pro</h1>
        <p class="text-xs text-slate-400">ASP.NET 10 | Repository Pattern | Dockerized</p>
      </div>
      <div id="authStatus" class="text-sm text-slate-400">Not Logged In</div>
    </header>

    
    <div id="authBox" class="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-md mx-auto shadow-xl">
      <div class="flex border-b border-slate-700 mb-4">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 pb-2 font-semibold text-sky-400 border-b-2 border-sky-400">Sign In</button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 pb-2 font-semibold text-slate-400">Register</button>
      </div>

      <div class="space-y-3">
        <input id="authUsername" type="text" placeholder="Username" class="w-full bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm focus:outline-none focus:border-sky-500">
        <input id="authPassword" type="password" placeholder="Password (min 6 chars)" class="w-full bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm focus:outline-none focus:border-sky-500">
        
        <div id="roleSelectorDiv" class="hidden">
          <label class="block text-xs text-slate-400 mb-1">Select Role</label>
          <select id="authRole" class="w-full bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm focus:outline-none focus:border-sky-500">
            <option value="User">Regular User (View & Edit)</option>
            <option value="Admin">Administrator (Full Access + Delete)</option>
          </select>
        </div>

        <button id="authSubmitBtn" onclick="submitAuth()" class="w-full bg-sky-600 hover:bg-sky-500 py-2 rounded font-semibold text-sm transition">Sign In</button>
      </div>
    </div>


    <div id="dashboard" class="hidden space-y-6">
      
    
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
        <h3 class="text-md font-semibold mb-3 text-sky-400">➕ Add New Product</h3>
        <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
          <input id="pName" placeholder="Product Name *" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:border-sky-500">
          <input id="pCategory" placeholder="Category" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:border-sky-500">
          <input id="pPrice" type="number" step="0.01" placeholder="Price *" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:border-sky-500">
          <input id="pStock" type="number" placeholder="Stock *" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:border-sky-500">
          <input id="pImageFile" type="file" accept="image/*" class="bg-slate-900 border border-slate-700 p-1.5 rounded text-xs file:bg-slate-800 file:border-0 file:text-sky-400 file:rounded file:px-2 file:py-1">
        </div>
        <button onclick="addProduct()" class="mt-3 bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded text-sm font-semibold transition">Save Product</button>
      </div>


      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-1 gap-2 min-w-[280px]">
          <input id="searchInput" oninput="debounceSearch()" type="text" placeholder="Search by name or category..." class="flex-1 bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm focus:outline-none focus:border-sky-500">
          <select id="pageSizeSelect" onchange="loadProducts(1)" class="bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm">
            <option value="5">5 per page</option>
            <option value="10">10 per page</option>
            <option value="20">20 per page</option>
          </select>
        </div>
        <button onclick="loadProducts(1)" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm transition">Search</button>
      </div>


      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-md">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-slate-950/60 text-slate-400 text-xs uppercase tracking-wider">
              <tr>
                <th class="p-3.5">Image</th>
                <th class="p-3.5">Name</th>
                <th class="p-3.5">Category</th>
                <th class="p-3.5">Price</th>
                <th class="p-3.5">Stock</th>
                <th class="p-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="productTableBody" class="divide-y divide-slate-700">

            </tbody>
          </table>
        </div>


        <div class="p-4 bg-slate-850 border-t border-slate-700 flex justify-between items-center text-sm">
          <span id="pageInfo" class="text-slate-400 text-xs">Showing 0 of 0 items</span>
          <div class="flex gap-2">
            <button id="prevBtn" onclick="changePage(-1)" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded disabled:opacity-40 disabled:cursor-not-allowed">Previous</button>
            <span id="currentPageBadge" class="px-3 py-1.5 bg-slate-900 rounded font-mono text-sky-400">1</span>
            <button id="nextBtn" onclick="changePage(1)" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
          </div>
        </div>
      </div>
    </div>


    <div id="editModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md shadow-2xl space-y-4">
        <h3 class="text-lg font-semibold text-sky-400 border-b border-slate-700 pb-2">Edit Product</h3>
        <input type="hidden" id="editId">
        <div class="space-y-3">
          <input id="editName" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm">
          <input id="editCategory" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm">
          <input id="editPrice" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm">
          <input id="editStock" type="number" class="w-full bg-slate-900 border border-slate-700 p-2 rounded text-sm">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button onclick="closeEditModal()" class="px-4 py-1.5 bg-slate-700 rounded text-sm">Cancel</button>
          <button onclick="updateProduct()" class="px-4 py-1.5 bg-sky-600 rounded text-sm font-semibold">Update</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let token = localStorage.getItem('jwt_token') || '';
    let currentRole = localStorage.getItem('jwt_role') || '';
    let authMode = 'login';
    let currentPage = 1;
    let totalPages = 1;
    let debounceTimer;

    if (token) showDashboard(localStorage.getItem('jwt_user') || 'User');

    function switchAuthTab(mode) {
      authMode = mode;
      const isLogin = mode === 'login';
      document.getElementById('tabLoginBtn').className = `flex-1 pb-2 font-semibold ${isLogin ? 'text-sky-400 border-b-2 border-sky-400' : 'text-slate-400'}`;
      document.getElementById('tabRegisterBtn').className = `flex-1 pb-2 font-semibold ${!isLogin ? 'text-sky-400 border-b-2 border-sky-400' : 'text-slate-400'}`;
      document.getElementById('roleSelectorDiv').classList.toggle('hidden', isLogin);
      document.getElementById('authSubmitBtn').textContent = isLogin ? 'Sign In' : 'Create Account';
    }

    async function submitAuth() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const role = document.getElementById('authRole').value;

      if (!username || !password) return alert('Username & Password required!');

      const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
      const payload = authMode === 'login' ? { username, password } : { username, password, role };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const data = await res.json();
          token = data.token;
          currentRole = data.role;
          localStorage.setItem('jwt_token', token);
          localStorage.setItem('jwt_user', data.username);
          localStorage.setItem('jwt_role', data.role);
          showDashboard(data.username);
        } else {
          const err = await res.json();
          alert(err.message || 'Authentication failed.');
        }
      } catch {
        alert('Server unreachable.');
      }
    }

    function showDashboard(username) {
      document.getElementById('authBox').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('authStatus').innerHTML = `
        <span class="px-2 py-0.5 rounded text-xs font-mono ${currentRole === 'Admin' ? 'bg-amber-500/20 text-amber-300' : 'bg-slate-700 text-slate-300'}">${currentRole}</span>
        <span class="text-sky-400 font-semibold ml-1">${username}</span> | 
        <button onclick="logout()" class="text-rose-400 hover:underline">Logout</button>
      `;
      loadProducts(1);
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    function debounceSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => loadProducts(1), 350);
    }

    async function loadProducts(page = 1) {
      currentPage = page;
      const search = document.getElementById('searchInput').value.trim();
      const pageSize = document.getElementById('pageSizeSelect').value;

      const res = await fetch(`/api/products?search=${encodeURIComponent(search)}&page=${page}&pageSize=${pageSize}`);
      const data = await res.json();

      totalPages = data.totalPages || 1;
      document.getElementById('currentPageBadge').textContent = currentPage;
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
      document.getElementById('pageInfo').textContent = `Page ${data.page} of ${totalPages} (${data.totalCount} items)`;

      const tbody = document.getElementById('productTableBody');
      if (!data.items || data.items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">No matching products found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.items.map(p => `
        <tr class="hover:bg-slate-750/50">
          <td class="p-3">
            <img src="${p.imageUrl || 'https://placehold.co/48x48/1e293b/94a3b8?text=Item'}" class="w-10 h-10 object-cover rounded-lg border border-slate-700">
          </td>
          <td class="p-3 font-medium text-white">${p.name}</td>
          <td class="p-3 text-slate-300">${p.category || '-'}</td>
          <td class="p-3 text-emerald-400 font-mono">৳${p.price.toFixed(2)}</td>
          <td class="p-3">${p.stock}</td>
          <td class="p-3 text-right space-x-2">
            <button onclick="openEditModal(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="text-xs bg-sky-600/20 text-sky-400 hover:bg-sky-600 hover:text-white px-2.5 py-1 rounded transition">Edit</button>
            ${currentRole === 'Admin' ? `<button onclick="deleteProduct(${p.id})" class="text-xs bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white px-2.5 py-1 rounded transition">Delete</button>` : ''}
          </td>
        </tr>
      `).join('');
    }

    function changePage(delta) {
      const target = currentPage + delta;
      if (target >= 1 && target <= totalPages) loadProducts(target);
    }

    async function addProduct() {
      const name = document.getElementById('pName').value.trim();
      const category = document.getElementById('pCategory').value.trim();
      const price = parseFloat(document.getElementById('pPrice').value);
      const stock = parseInt(document.getElementById('pStock').value);
      const imageFile = document.getElementById('pImageFile').files[0];

      if (!name || isNaN(price) || isNaN(stock)) return alert('Name, Price and Stock are required!');

      let imageUrl = null;

      // if an image file is selected, upload it first
      if (imageFile) {
        const formData = new FormData();
        formData.append('file', imageFile);

        const uploadRes = await fetch('/api/products/upload-image', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        if (uploadRes.ok) {
          const imgData = await uploadRes.json();
          imageUrl = imgData.imageUrl;
        }
      }

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ name, category, price, stock, imageUrl })
      });

      if (res.ok) {
        document.getElementById('pName').value = '';
        document.getElementById('pCategory').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pStock').value = '';
        document.getElementById('pImageFile').value = '';
        loadProducts(1);
      } else {
        alert('Failed to save product.');
      }
    }

    function openEditModal(product) {
      document.getElementById('editId').value = product.id;
      document.getElementById('editName').value = product.name;
      document.getElementById('editCategory').value = product.category || '';
      document.getElementById('editPrice').value = product.price;
      document.getElementById('editStock').value = product.stock;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function updateProduct() {
      const id = document.getElementById('editId').value;
      const name = document.getElementById('editName').value.trim();
      const category = document.getElementById('editCategory').value.trim();
      const price = parseFloat(document.getElementById('editPrice').value);
      const stock = parseInt(document.getElementById('editStock').value);

      const res = await fetch(`/api/products/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ name, category, price, stock })
      });

      if (res.ok) {
        closeEditModal();
        loadProducts(currentPage);
      }
    }

    async function deleteProduct(id) {
      if (!confirm(`Delete product #${id}?`)) return;

      const res = await fetch(`/api/products/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.ok) loadProducts(currentPage);
      else alert('Failed to delete.');
    }
  </script>
</body>
</html>
